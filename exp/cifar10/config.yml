# ==========================================================
# PTQ 配置 - CIFAR10
# 运行: python ptq/main.py --config exp/cifar10/config.yml
# ==========================================================

# ========== 模型 ==========
checkpoint: /mnt/disk2/st/output_links/sdtv1_output/train/20260115-214127-sdt-data-cifar10-t-4-spike-lif/model_best.pth.tar

# 模型结构参数 (与训练时一致)
time_steps: 4
num_classes: 10
num_heads: 8
img_size: 32
in_channels: 3
dim: 256
mlp_ratio: 4
layer: 2
pooling_stat: "0011"
TET: false

# ========== 数据 ==========
dataset: torch/cifar10
data_dir: /mnt/disk2/xh2/data
batch_size: 64

# ========== 量化 ==========
weight_bit: 4
first_layer_bit: 16
last_layer_bit: 8
mem_bit: 4
# patch_embed.proj_lif 膜电位位宽（与首层 proj_conv 共用 scale）；默认 16；>=32 表示该层不量化膜电位
first_mem_bit: 4
fold_bn: true
observer: mse
mem_observer: mse

# ========== 量化方法 ==========
fake_quant: adaround
adaround_iters: 500
adaround_lr: 0.003
recon_num_batches: 8          # layer-wise reconstruction calibration batches
recon_mem_lam: 0.25           # pre-fire membrane reconstruction weight
recon_reg_lam_scale: 0.0001   # reg_lam = recon_reg_lam_scale * layer output max
recon_max_code_shift: 2.0     # max integer-code movement per weight
recon_min_iters: 50
recon_early_stop_patience: 0  # 0=auto: min(80, max(20, iters/10))
recon_improve_eps: 0.000001
recon_grad_clip: 1.0
recon_log_interval: 100

# ========== Scale Bridging ==========
scale_bridge: unify

# ========== 运行 ==========
gpu: 7
output_dir: output/ptq/cifar10

# ========== 其他 ==========
seed: 52
