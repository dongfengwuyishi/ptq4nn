# ==========================================================
# PTQ 配置 - ImageNet (Spike-Driven Transformer 8-768)
# 预训练:   pretrained/8_768.pth  (expected FP Top-1 ~77.07%)
# 训练配置: conf/imagenet/8_768_300E_t4.yml
# 运行:    ./exp/imageNet/ptq_run.sh
# ==========================================================

# ========== 模型 ==========
checkpoint: /mnt/disk1/st/sdtv1/Spike-Driven-Transformer/pretrained/8_768.pth

# 模型结构参数 (与 conf/imagenet/8_768_300E_t4.yml 保持一致)
time_steps: 4
num_classes: 1000
num_heads: 8
img_size: 224
in_channels: 3
dim: 768
mlp_ratio: 4
layer: 8
pooling_stat: "1111"
TET: false

# ========== 数据 ==========
dataset: imagenet
data_dir: /mnt/disk1/datasets/imagenet
# 8_768 显存占用较大 (T=4, 224×224, 768 dim)，batch 不能太大
batch_size: 32
# 与训练验证一致 (见 conf/imagenet/8_768_300E_t4.yml: crop_pct=0.95)
crop_pct: 0.95

# ========== 量化 ==========
weight_bit: 4
first_layer_bit: 16        # patch_embed.proj_conv (首层卷积) 用 8-bit 保精度
last_layer_bit: 8         # 分类头 head 用 8-bit 保精度
mem_bit: 4
# patch_embed.proj_lif 膜电位位宽；默认与 mem_bit 一致，>=32 则该层 FP 膜电位
first_mem_bit: 4
fold_bn: true
observer: mse
mem_observer: mse

# ========== 量化方法 ==========
fake_quant: adaround
# ImageNet 层数多 (8) 且 patch 多 (14×14=196)，单层 AdaRound 迭代放到 1000
adaround_iters: 1000
adaround_lr: 0.003

# ========== Scale Bridging ==========
scale_bridge: unify

# ========== 运行 ==========
gpu: 7
output_dir: output/ptq/imagenet

# ========== 其他 ==========
seed: 42
